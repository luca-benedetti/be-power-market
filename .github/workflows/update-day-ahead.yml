name: Update day-ahead data

on:
  schedule:
    # Every 3 hours; day-ahead for tomorrow is published around 13:00 CET
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ENTSO-E day-ahead prices
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python scripts/build_data.py

      - name: Commit if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/da.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Update day-ahead data"
            git push
          fi
